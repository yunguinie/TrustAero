name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,duckdb]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/trustaero
      - run: python scripts/check_schema_sync.py
      - run: python artifact/verify.py
      - run: python -m pytest -m "not local_artifact"
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trustaero-artifact .
      - run: docker run --rm trustaero-artifact
