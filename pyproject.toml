[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustaero"
version = "0.1.0"
description = "Deterministic validation for untrusted agent-generated governed spatio-temporal query plans."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "TrustAero Authors"}]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
]

[project.scripts]
trustaero = "trustaero.cli.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustaero = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["trustaero"]
