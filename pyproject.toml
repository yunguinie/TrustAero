[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustaero"
version = "0.1.0"
description = "Deterministic validation for untrusted agent-generated governed spatio-temporal query plans."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
authors = [{name = "TrustAero Authors"}]
keywords = ["database systems", "query planning", "data governance", "lineage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
]
duckdb = [
  "duckdb>=1.0,<2",
]

[project.scripts]
trustaero = "trustaero.cli.validate:main"

[project.urls]
Repository = "https://github.com/yunguinie/TrustAero"
Issues = "https://github.com/yunguinie/TrustAero/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustaero = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "local_artifact: requires intentionally ignored local data or result artifacts",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
# Several experiment loaders deliberately retain explicit casts at JSON
# boundaries to document the expected artifact shape.  They are harmless and
# make those untyped boundaries easier to review, so do not reject them as
# redundant during release CI.
warn_redundant_casts = false
disable_error_code = ["redundant-cast"]
packages = ["trustaero"]
